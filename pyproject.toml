[project]
name = "livekit-voice-demo"
version = "0.1.0"
description = "Morning-brief voice agent on LiveKit Agents: STT -> LLM -> TTS, tools, knowledge base and a Claude webhook."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "livekit-agents[anthropic,assemblyai,google,openai,silero]>=1.8.11",
    "livekit-api>=1.2.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
